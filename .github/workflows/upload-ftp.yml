name: Upload FTP

on:
  push:
    branches:
      - main
      - master
  # Permite lanzarlo a mano desde la pestaña Actions, sin inventarse un commit.
  workflow_dispatch:

# Dos subidas a la vez se pisarían en el servidor y dejarían el fichero de estado de la acción a
# medias: si llega un push mientras sube otro, este espera a que el anterior termine.
concurrency:
  group: subida-ftp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Subir web por FTP
    steps:
      # v5 ya funciona con Node 24 (quita el aviso de Node 20 para este paso).
      - uses: actions/checkout@v5

      - name: 📂 Sync files with FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Los datos de acceso van en Settings → Secrets and variables → Actions,
          # nunca escritos aquí: el repositorio es público.
          server: 185.42.104.76
          username: uyuyuyea
          password: "!!1IsdzeVDHxUQyX"

          # FTP cifrado. Si el hosting no admite FTPS, cambia a: protocol: ftp
          protocol: ftp
          # Necesario si FTP_SERVER es una IP: el certificado del servidor no coincidirá con ella.
          # Si usas el nombre de dominio del servidor FTP, puedes quitar esta línea.

          # Carpeta local que se sube (la raíz del repo) y carpeta de destino en el servidor.
          # Ambas deben terminar en /.
          local-dir: ./
          server-dir: /web/nueva-pagina/

          timeout: 60000
          # Muestra la conversación FTP completa en el log. Cuando funcione, vuelve a: minimal
          log-level: verbose

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.DS_Store
